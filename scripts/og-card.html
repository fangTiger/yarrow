<!doctype html>
<!-- 分享预览图源稿（1200×630）：用无头 Chrome 截图生成 web/brand/og.png。
     node <cdp 截图脚本> file://$PWD/scripts/og-card.html web/brand/og.png 1200 630 -->
<html lang="en"><head><meta charset="utf-8"><style>
@font-face { font-family: Brush; src: url("../web/fonts/mashanzheng-subset.woff2") format("woff2"); }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: radial-gradient(circle at 78% 50%, #1d211e 0, #0f1110 62%); color: #eae5d9;
  font-family: Georgia, "Times New Roman", serif; display: grid; grid-template-columns: 300px 1fr;
  align-items: center; padding: 0 84px; gap: 64px; position: relative; }
body::after { content: ""; position: absolute; inset: 28px; border: 1px solid rgb(201 168 102 / 0.28); }
.mark { width: 300px; height: 300px; filter: drop-shadow(0 18px 40px rgb(0 0 0 / 0.45)); }
.name { display: flex; align-items: baseline; gap: 22px; }
.name b { font-weight: 400; font-size: 92px; letter-spacing: 0.01em; }
.name span { font-family: Brush, "Kaiti SC", serif; font-size: 64px; color: #c9a866; letter-spacing: 0.08em; }
.tag { margin-top: 18px; font-size: 34px; line-height: 1.32; color: #eae5d9; }
.tag em { font-style: normal; color: #c9a866; }
.meta { margin-top: 30px; display: flex; gap: 14px; font-family: -apple-system, "Helvetica Neue", sans-serif;
  font-size: 20px; color: #a6a195; }
.meta i { font-style: normal; border: 1px solid rgb(201 168 102 / 0.42); padding: 6px 14px; border-radius: 2px; }
</style></head><body>
<img class="mark" src="../web/brand/yarrow-mark.svg" alt="">
<div>
  <div class="name"><b>Yarrow</b><span>三易</span></div>
  <p class="tag">Three classical masters read your fate.<br><em>Arc makes the casting verifiable.</em></p>
  <div class="meta"><i>I Ching</i><i>BaZi · Life luck cycles</i><i>0.05 USDC on Arc</i></div>
</div>
</body></html>
